# Company websites found by the discovery workflows (data/sites.csv). Each day the reader checks
# the ones that publish jobs (sitemaps, job markup, RSS), oldest-checked first.
site_reader:
  sites_per_day: 3000
  pages_per_site: 6        # job pages opened per site per day (only titles that look like a fit)
  window_days: 7           # sitemap entries changed in the last 7 days

# ================================================================== DISCOVERY (weekly / monthly workflows)
discovery:
  # country web addresses searched for careers pages (Common Crawl + certificate logs)
  tlds: [pk, ae, sa, qa, bh, om, kw, jo, eg, my, sg, jp, uk, ie, de, nl, pl, hu, cz, pt, tr, ca, au, nz]
  max_hosts_per_tld: 4000
  cc_minutes: 150          # time limit for the Common Crawl sweep
  probe_minutes: 90        # time limit for checking new websites
  probe_per_run: 20000
  validate_minutes: 90     # time limit for checking employers' job boards
  private_scale: 0.2       # while the repository is private, discovery uses this share of the time limits

# Optional: if LinkedIn keeps blocking, add a GitHub secret named PROXIES
# (comma-separated, e.g. user:pass@host:port). Used automatically.
