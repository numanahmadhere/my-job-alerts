# ------------------------------------------------------------------
# My Job Alerts: personal job feed for Numan
# Edit this file to change roles, cities or searches. No code changes needed.
# ------------------------------------------------------------------

# Cities to keep. A job is kept only if its location names one of these.
# (Keys are what the Sheet shows; values are words matched in the job's location.)
cities:
  Lahore: ['lahore']
  Islamabad: ['islamabad', 'rawalpindi']
  Karachi: ['karachi']
  Dubai: ['dubai']
  Riyadh: ['riyadh']

# Remote jobs: kept when the location is open to these places (or says only "Remote").
# Remote jobs limited to other countries (e.g. "United States - Remote") are dropped.
include_remote: true
remote_open_to: 'worldwide|anywhere|global|asia|apac|emea|middle east|gcc|pakistan|\bpk\b|united arab emirates|\buae\b|\bae\b|saudi|\bksa\b|\bsa\b|dubai|riyadh|lahore|karachi|islamabad'
remote_boards: [remoteok, weworkremotely]

# Role groups. A job is kept if its TITLE matches a group (checked top to bottom).
# Patterns are regex, case-insensitive.
role_groups:
  - name: "Teaching & Faculty"
    title: '\b(lecturer|assistant professor|associate professor|professor|faculty|instructor|teaching fellow|(ai|data|analytics|power ?bi|corporate) trainer)\b'
    requires: '\b(data|analytics|ai|a\.i\.|artificial intelligence|machine learning|computer science|computing|cs|business|management|mba|statistics|information (systems|technology)|mis|economics|finance|marketing|bba)\b'
  - name: "RevOps"
    title: '\b((head|director|vp) of (revenue|sales|gtm) operations|revenue operations|revops|rev ops|sales operations|sales ops|gtm operations|go[- ]to[- ]market operations|commercial operations|salesforce (analyst|administrator|admin|specialist|consultant|lead|manager)|crm (analyst|manager|specialist|lead|administrator))\b'
  - name: "AI Product / Applied AI"
    title: '\b(ai product|product (manager|owner|specialist|lead)[^,]{0,25}\b(ai|ml|data)\b|(ai|genai|gen ai) (solutions?|implementation|specialist|consultant|strategist|transformation|lead|manager|analyst)|applied ai|ai adoption)'
  - name: "Data & BI"
    title: '\b((head|director) of (data|analytics|bi|business intelligence|insights)|data analyst|analytics (lead|manager|specialist|consultant|analyst|engineer)|business intelligence|bi (analyst|developer|specialist|lead|manager|engineer|consultant)|power ?bi|tableau|product analyst|insights? (analyst|manager|lead)|reporting analyst|experimentation|a/?b test|business analyst|data analytics)'
  - name: "Strategy & Ops"
    title: '\b((head|director|vp) of (strategy|business operations|planning)|strategy (and|&) (planning|operations)|strategic planning|business operations|bizops|strategy (analyst|associate|manager|lead|consultant)|(strategic|business|corporate) planning|operations strategy)'
  - name: "Data Science"
    title: '\bdata scien'

# Titles containing any of these are dropped even if they match a group above.
exclude_title: '\b(intern|internship|trainee|junior|jr\.?|fresh(er)?|graduate program|sales (executive|representative|associate|officer|agent|manager)|account executive|business development|telesales|call cent(er|re)|data entry)\b'

# Searches
sites:
  linkedin:
    results_per_query: 25        # LinkedIn blocks heavy use; keep small
    locations: ["Pakistan", "Dubai, United Arab Emirates", "Riyadh, Saudi Arabia"]
    queries:
      - "data analyst"
      - "business intelligence"
      - "revenue operations"
      - "sales operations"
      - "AI product"
      - "strategy and planning"
      - "data scientist"
      - "lecturer"
      - "assistant professor"
  indeed:
    results_per_query: 100
    # country_indeed -> location searched in that country
    markets:
      Pakistan: "Pakistan"
      United Arab Emirates: "Dubai"
      Saudi Arabia: "Riyadh"
    queries:
      - '"data analyst" OR "business intelligence" OR "BI analyst" OR "power bi" OR "analytics manager" OR "product analyst"'
      - '"revenue operations" OR revops OR "sales operations" OR "salesforce analyst" OR "salesforce administrator" OR "CRM analyst"'
      - '"AI product" OR "AI specialist" OR "AI consultant" OR "AI solutions" OR "applied AI" OR "AI implementation"'
      - '"strategy and planning" OR "business operations" OR "strategy analyst" OR "strategy manager" OR "data scientist"'
      - 'lecturer OR "assistant professor" OR "associate professor" OR faculty OR instructor OR "AI trainer" OR "data trainer"'
  bayt:
    results_per_query: 50
    locations: ["Dubai, UAE", "Riyadh, Saudi Arabia"]
    queries:
      - "data analyst"
      - "business intelligence"
      - "revenue operations"
      - "sales operations"
      - "ai product"
      - "strategy"
      - "data scientist"
      - "lecturer"

hours_old: 48                   # normal daily run looks back 2 days; duplicates are removed
pause_seconds: 6                # wait between searches to reduce blocking
fetch_description: false        # titles are enough for matching; keeps runs fast and LinkedIn-friendly
feed_window_days: 3             # career pages: only jobs posted in the last 3 days count as new
repost_window_days: 30          # a job seen again within 30 days is not added again

