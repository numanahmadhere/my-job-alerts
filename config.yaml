    "Galileo": {tenant: galileo, shard: wd3, site: galileo_career_site}
    "Contour Software": {tenant: talentmanagementsolution, shard: wd3, site: ContourSoftware-Careers}

# Workday has no "list everything" view, so each employer is searched with these words.
workday:
  keywords: ["analyst", "data", "business intelligence", "revenue operations", "strategy", "product manager", "lecturer"]
  max_pages: 2            # 20 jobs per page

# Employers found automatically (Common Crawl, website checks) are kept in data/employers.csv
# and added to the list above every day. Only employers with jobs in your markets are kept.

# Job-board sitemaps: the list of live jobs a site publishes for search engines.
# Only jobs whose title looks like a fit are opened (max per site per run).
sitemaps:
  rozee: true
  gulftalent: true
  gulftalent_countries: [uae, saudi-arabia, qatar, kuwait, oman, bahrain, jordan, egypt]
  window_days: 30          # sitemap entries updated in the last 30 days
  max_details_per_site: 60

# Optional free aggregator APIs. Each one is skipped unless its key is added as a GitHub secret:
#   CAREERJET_AFFID (free partner account), JOOBLE_KEY (free key by request), SERPAPI_KEY (free 250 searches/month)
aggregators:
  referer_url: "https://github.com/numanahmadhere/my-job-alerts"
  targets:
    - {locale: en_PK, location: Lahore}
    - {locale: en_PK, location: Karachi}
    - {locale: en_PK, location: Islamabad}
    - {locale: en_AE, location: Dubai}
    - {locale: en_AE, location: Abu Dhabi}
    - {locale: en_SA, location: Riyadh}
    - {locale: en_SA, location: Jeddah}
    - {locale: en_QA, location: Doha}
    - {locale: en_GB, location: London}
  keywords: ["data analyst", "business intelligence", "revenue operations", "strategy", "AI product", "lecturer"]
  # Google Jobs (SerpApi): 8 searches a day stays inside the free 250/month.
  # Searches rotate through every role x city below, so all cities get covered every few days.
  google_jobs_per_day: 8
  google_jobs_roles: ["data analyst", "business intelligence", "revenue operations", "AI product specialist",
                      "strategy and planning", "data scientist", "lecturer data science"]
  google_jobs_places: ["Lahore", "Karachi", "Islamabad", "Dubai", "Abu Dhabi", "Riyadh", "Jeddah", "Doha",
                       "Manama", "Muscat", "Kuwait City", "Amman", "Cairo"]

# "What's new today" signals
signals:
  # Google Alerts: create alerts at google.com/alerts with "Deliver to: RSS feed", then put the feed
  # links in a GitHub secret named GOOGLE_ALERTS_FEEDS (one per line). Links listed here also work,
  # but anyone who can see this file can see them.
  google_alerts: []
  # Brave Search, results from the past 24 hours. Needs a BRAVE_KEY secret (free monthly credit).
  brave_queries_per_day: 30
  brave_roles: ['"data analyst"', '"business intelligence"', '"revenue operations"', '"AI product"',
                '"strategy and planning"', '"data scientist"', '"lecturer" "data science"']
  brave_places: ["Lahore", "Karachi", "Islamabad", "Dubai", "Abu Dhabi", "Riyadh", "Jeddah", "Doha",
                 "Manama", "Muscat", "Kuwait", "Amman", "Cairo", "Kuala Lumpur", "Singapore",
                 "London visa sponsorship", "Dublin visa sponsorship", "Berlin visa sponsorship",
                 "Amsterdam visa sponsorship", "Toronto visa sponsorship", "Sydney visa sponsorship"]
  max_pages_opened: 60     # job pages opened per day from alerts / Brave
  # Public Telegram channels (read through the t.me/s/ web preview). Only posts whose title
  # matches your roles AND whose location matches your cities are kept.
  telegram: [jobs_sql]      # jobsvacancydubai and datasciencejobs removed: no matching posts in practice

