remote_open_to: 'worldwide|anywhere|global|asia|apac|emea|middle east|mena|gcc|pakistan|\bpk\b|united arab emirates|\buae\b|\bae\b|saudi|\bksa\b|\bsa\b|dubai|riyadh|lahore|karachi|islamabad|international|any location|all countries'
remote_boards: [remoteok, weworkremotely, remotive, himalayas, jobicy, workingnomads, arbeitnow]

# ================================================================== WHAT
# Role groups. A job is kept if its TITLE matches a group (checked top to bottom).
# Patterns are regex, case-insensitive.
role_groups:
  - name: "Teaching & Faculty"
    title: '\b(lecturer|assistant professor|associate professor|professor|faculty|instructor|teaching fellow|(ai|data|analytics|power ?bi|corporate|python|excel|machine learning|ml) trainer|trainer[^,]{0,20}\b(ai|data|analytics|power ?bi))\b'
    requires: '\b(data|analytics|ai|a\.i\.|artificial intelligence|machine learning|computer science|computing|cs|business|management|mba|statistics|information (systems|technology)|mis|economics|finance|marketing|bba|power ?bi|python)\b'
  - name: "RevOps"
    title: '\b((head|director|vp) of (revenue|sales|gtm) operations|revenue operations|revops|rev ops|sales operations|sales ops|gtm operations|gtm strategy|go[- ]to[- ]market (operations|strategy)|commercial operations|commercial excellence|sales excellence|sales (analyst|analytics|strategy)|revenue (analyst|strategy|strategist)|deal desk|marketing operations|customer success operations|business systems analyst|salesforce (analyst|administrator|admin|specialist|consultant|lead|manager|developer)|hubspot (admin|administrator|specialist|consultant)|crm (analyst|manager|specialist|lead|administrator|executive))\b'
  - name: "AI Product / Applied AI"
    title: '\b(ai product|product (manager|owner|specialist|lead|analyst)[^,]{0,25}\b(ai|ml|data|analytics)\b|(ai|genai|gen ai|generative ai|llm) (solutions?|implementation|specialist|consultant|strategist|strategy|transformation|lead|manager|analyst|engineer|trainer|educator|enablement|automation|evangelist|program manager|project manager|architect)|applied ai|ai adoption|ai automation|prompt engineer|copilot|ai[- ]powered|automation (specialist|consultant|lead) )'
  - name: "Data & BI"
    title: '\b((head|director|vp) of (data|analytics|bi|business intelligence|insights)|data (analyst|lead|manager|specialist)|analytics (lead|manager|specialist|consultant|analyst|engineer|executive|officer)|business intelligence|bi (analyst|developer|specialist|lead|manager|engineer|consultant)|power ?bi|tableau|looker|product analyst|insights? (analyst|manager|lead|specialist)|business insights|reporting (analyst|specialist|manager|lead)|experimentation|a/?b test|business analyst|data analytics|mis (analyst|executive|officer|manager|specialist|lead|coordinator)|management information|decision scien|commercial analyst|operations analyst|payments? (analyst|operations)|marketing analyst|customer analyst|pricing (analyst|manager|lead|strategy|specialist)|performance analyst|kpi)'
  - name: "Strategy & Ops"
    title: '\b((head|director|vp) of (strategy|business operations|planning|growth|transformation)|strategy (and|&) (planning|operations|business operations|analytics)|strategy[^,]{0,15}operations|strategic planning|business operations|bizops|strategy (analyst|associate|manager|lead|consultant|specialist|officer|executive)|(strategic|business|corporate|commercial) planning|planning (analyst|manager|lead|specialist)|operations strategy|corporate strategy|business strategy|chief of staff|founder.?s office|ceo office|business (excellence|transformation|performance)|operational excellence|transformation (manager|lead|analyst|office)|growth (analyst|manager|lead|strategy|&|and)|performance management|pmo (analyst|lead|manager)|special projects)'
  - name: "Data Science"
    title: '\b(data scien|machine learning (engineer|scientist|specialist|lead)|ml (engineer|scientist)|applied scientist|quantitative analyst|statistician|ai/ml|ml/ai)'

# Titles containing any of these are dropped even if they match a group above.
exclude_title: '\b(intern|internship|trainee|junior|jr\.?|fresh(er)?|graduate program|sales (executive|representative|associate|officer|agent|manager)|account executive|business development|telesales|call cent(er|re)|data entry|production planning|demand planning|supply (chain|planning)|media plann(ing|er)|event plann(ing|er)|maintenance planning|material planning|planning engineer)\b'

# "Nationals only" jobs (Gulf / Middle East) are dropped. Checked on the title, and on the
# job description when one is available.
nationals_title: '\b(saudi|uae|emirati|qatari|omani|kuwaiti|bahraini|jordanian|egyptian) nationals?\b|\bnationals? only\b|\bemirati\b|\bemirati[sz]ation\b|\bsaudi[sz]ation\b|\bnational (talent|graduate) program|\((saudi|emirati|omani|qatari|kuwaiti|bahraini)s?\)|\bsaudis? only\b|للسعوديين|مواطن'
nationals_text: 'nationals? only|only (for )?(saudi|uae|emirati|qatari|omani|kuwaiti|bahraini)s?( nationals| citizens)?\b|(saudi|uae|qatari|omani|kuwaiti|bahraini) nationals? (only|are encouraged|preferred|candidates only)|(must|should) be (an? )?(saudi|uae|emirati|qatari|omani|kuwaiti|bahraini)( national| citizen)?\b|open (only )?to (saudi|uae|emirati|qatari|omani|kuwaiti|bahraini) (nationals|citizens)|emirati[sz]ation (role|position|program|opportunit)|saudi[sz]ation (role|position)|للسعوديين فقط|للمواطنين فقط'

# Visa wording in job descriptions
visa_yes: 'visa sponsorship (is )?(available|provided|offered|possible)|sponsorship (is )?(available|provided|offered|possible)|(will|can|able to|happy to|we) (offer |provide )?(visa )?sponsor(ship)?\b|sponsor (your |a |the )?(work )?(visa|permit)|relocation (package|support|assistance|bonus|allowance|budget|is provided|provided|offered|available)|(help|support|assist) (you )?(with )?(your )?relocat|skilled worker visa|blue card|work permit (support|sponsorship|assistance|provided)|highly skilled migrant|kennismigrant|visa support|visa (and|&) relocation|relocation (and|&) visa|open to (international|overseas) (candidates|applicants)|we sponsor'
visa_no: '(no|not|unable to|cannot|can ?not|can.t|won.t|will not|do not|don.t|does not|doesn.t|are not able to|is not|isn.t)( be)?( able to)?( currently)?( offer| provide| support)?\s*(visa )?sponsor|sponsorship (is )?not (available|offered|provided|possible)|without (the need for )?(visa )?sponsorship|must (already )?(have|hold) (the |a )?(full |existing |valid |current )?(right to work|work permit|work authori[sz]ation)|(existing|current|valid) right to work|eligible to work in [a-z ]{2,25} without|(eu|eea) citizens? only|citizens? only|permanent residents? only|(singaporeans?|malaysians?)( citizens)?( (and|or|/) ?prs?)? only|only (singaporeans?|malaysians?|citizens|local candidates)|no relocation|local candidates only'

# ================================================================== SEARCHES
sites:
  linkedin:
    results_per_query: 50        # per search; a market can raise it with results: 100
    query_sets:
      full: ["data analyst", "business intelligence", "revenue operations", "sales operations", "AI product",
             "strategy and planning", "data scientist", "lecturer", "assistant professor", "analytics manager", "power bi"]
      pakistan: ["data analyst", "business intelligence", "revenue operations", "sales operations", "AI product",
                 "strategy and planning", "data scientist", "lecturer", "assistant professor", "analytics manager",
                 "power bi", "business analyst", "data analytics", "product analyst", "head of data", "BI developer",
                 "strategy manager", "corporate planning", "salesforce", "AI specialist", "business planning",
                 "pricing analyst", "growth analyst", "MIS", "chief of staff", "operations analyst"]
      core: ["data analyst", "business intelligence", "revenue operations", "AI product", "strategy and planning",
             "data scientist"]
      sponsorship: ["data analyst visa sponsorship", "business intelligence visa sponsorship",
                    "data scientist visa sponsorship", "revenue operations visa sponsorship",
                    "AI product manager visa sponsorship", "strategy visa sponsorship"]
  indeed:
    results_per_query: 100
    # One role per search. A QA on 2026-10-20 showed Indeed mishandles long "A OR B OR C" searches
    # (a 7-term search for Lahore returned 600 unrelated jobs, while "business analyst" alone returned
    # the right 5), so every search is a single role.
    query_sets:
      pakistan:   # each Pakistani city + the whole country
        - data analyst
        - business analyst
        - business intelligence
        - power bi
        - data analytics
        - data scientist
        - machine learning
        - analytics manager
        - product analyst
        - MIS
        - strategy
        - business planning
        - strategy and operations
        - business operations
        - revenue operations
        - sales operations
        - salesforce
        - CRM
        - pricing analyst
        - growth
        - operations analyst
        - AI
        - AI product
        - lecturer
        - assistant professor
        - trainer
      full:       # Gulf and Middle East (whole country)
        - data analyst
        - business analyst
        - business intelligence
        - power bi
        - data scientist
        - analytics manager
        - strategy
        - business planning
        - revenue operations
        - sales operations
        - AI product
        - AI specialist
        - pricing analyst
        - lecturer
      core_indeed:   # Malaysia, Singapore
        - data analyst
        - business analyst
        - business intelligence
        - data scientist
        - revenue operations
        - strategy and operations
        - AI product
        - pricing analyst
      sponsorship:   # UK, Europe, Canada, Australia, NZ, Japan, Turkey: role + visa wording, both required
        - data analyst visa sponsorship
        - business analyst visa sponsorship
        - business intelligence visa sponsorship
        - data scientist visa sponsorship
        - revenue operations visa sponsorship
        - strategy visa sponsorship
        - data analyst relocation
        - AI product visa sponsorship
  # Bayt was removed: it refuses requests from GitHub's servers (403).

hours_old: 48                   # normal daily run looks back 2 days; duplicates are removed
pause_seconds: 4                # wait between searches (each runner does only a share of them)
fetch_description: false        # descriptions are fetched later, only for jobs that need a visa / nationals check
feed_window_days: 3             # feeds: only jobs posted in the last 3 days count as new
repost_window_days: 30          # a job seen again within 30 days is not added again

# The daily run is split across this many parallel GitHub runners. Each has its own internet
# address, so LinkedIn sees fewer searches per address and the run finishes faster.
daily:
  shards: 10                    # search runners (LinkedIn, Indeed, hiring systems, feeds)
  site_shards: 4                # website runners (company websites found by discovery), run at the same time
  minutes_per_shard: 70         # a search runner stops starting new searches after this
  site_minutes_per_shard: 60
  checks_per_shard: 90          # job descriptions opened per runner for visa / nationals checks
  location_lookups_per_shard: 40   # matching jobs listed without a location: read it from the job page
  # A PRIVATE repository gets 2,000 free GitHub minutes a month; a public one is unlimited.
  # While the repository is private the run shrinks to fit (searches not reached rotate daily).
  private_shards: 2
  private_minutes_per_shard: 18
  private_site_shards: 1
  private_site_minutes_per_shard: 12

