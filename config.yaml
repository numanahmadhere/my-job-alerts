# ------------------------------------------------------------------
# My Job Alerts: personal job feed for Numan
# Edit this file to change roles, cities or searches. No code changes needed.
# ------------------------------------------------------------------

# ================================================================== WHERE
# Each market (country) lists:
#   region       shown in the Sheet's Region column
#   visa         gulf     = no visa filter, but "nationals only" jobs are dropped
#                open     = kept unless the ad says locals / citizens only or "no sponsorship"
#                required = kept only if the ad mentions visa sponsorship / relocation
#                           (or, for UK / Netherlands / Canada, the employer is on the
#                           government list of licensed visa sponsors)
#   names        words that mean the country itself (a job that only says "Qatar" is kept)
#   cities       city shown in the Sheet: words matched in the job's location
#                (accents are ignored; Arabic spellings included)
#   linkedin     LinkedIn search locations + which query set to use
#   indeed       run Indeed in this country (whole country) + which query set
markets:
  Pakistan:
    region: Pakistan
    visa: gulf
    names: ['pakistan']
    cities:
      Lahore: ['lahore', 'لاہور']
      Islamabad: ['islamabad', 'rawalpindi']
      Karachi: ['karachi']
    linkedin: {locations: ["Lahore, Pakistan", "Karachi, Pakistan", "Islamabad, Pakistan"], queries: pakistan}
    indeed: {country: Pakistan, queries: pakistan, where: ["", "Lahore", "Karachi", "Islamabad"]}   # whole country + each city

  UAE:
    region: Gulf
    visa: gulf
    names: ['united arab emirates', 'uae', 'الإمارات', 'الامارات']
