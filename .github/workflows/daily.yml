name: Daily job alerts

on:
  schedule:
    - cron: "0 2 * * *"      # 07:00 Pakistan time
    - cron: "0 14 * * *"     # 19:00 Pakistan time
  workflow_dispatch:           # "Run workflow" button for manual runs
    inputs:
      lookback_days:
        description: "Optional: look further back this many days. Only ADDS new jobs; existing rows are never changed. Leave blank for a normal run."
        required: false
        default: ""

permissions:
  contents: write             # lets the run save data/ back to the repo

concurrency:
  group: alerts
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.p.outputs.list }}
      shards: ${{ steps.p.outputs.shards }}
      site_list: ${{ steps.p.outputs.site_list }}
      site_shards: ${{ steps.p.outputs.site_shards }}
      private: ${{ steps.p.outputs.private }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: config.yaml
      - id: p
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRIVATE=$(gh api repos/${{ github.repository }} --jq .private || echo true)
          if [ "$PRIVATE" = "true" ]; then P=private_; else P=; fi
          get() { python3 -c "import re,sys; t=open('config.yaml').read(); print(re.search(r'^\s+'+sys.argv[1]+r':\s*(\d+)', t, re.M).group(1))" $1; }
          N=$(get ${P}shards); S=$(get ${P}site_shards)
          echo "private=$PRIVATE" >> $GITHUB_OUTPUT
          echo "shards=$N" >> $GITHUB_OUTPUT
          echo "list=$(python3 -c "print(list(range($N)))")" >> $GITHUB_OUTPUT
          echo "site_shards=$S" >> $GITHUB_OUTPUT
          echo "site_list=$(python3 -c "print(list(range($S)))")" >> $GITHUB_OUTPUT
          echo "Repository private: $PRIVATE -> $N search runners + $S website runners"

  search:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.list) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Search (runner ${{ matrix.shard }})
        env:
          PROXIES: ${{ secrets.PROXIES }}
          LOOKBACK_DAYS: ${{ inputs.lookback_days }}
          PRIVATE_REPO: ${{ needs.plan.outputs.private }}
          CAREERJET_AFFID: ${{ secrets.CAREERJET_AFFID }}
          JOOBLE_KEY: ${{ secrets.JOOBLE_KEY }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          BRAVE_KEY: ${{ secrets.BRAVE_KEY }}
          GOOGLE_ALERTS_FEEDS: ${{ secrets.GOOGLE_ALERTS_FEEDS }}
        run: python -m pipeline.run collect --shard ${{ matrix.shard }} --shards ${{ needs.plan.outputs.shards }} --role search
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: search-${{ matrix.shard }}
          path: out/shard_*.json
          retention-days: 3
          if-no-files-found: ignore

  sites:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.site_list) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Read company websites (runner ${{ matrix.shard }})
        env:
          PROXIES: ${{ secrets.PROXIES }}
          LOOKBACK_DAYS: ${{ inputs.lookback_days }}
          PRIVATE_REPO: ${{ needs.plan.outputs.private }}
          CAREERJET_AFFID: ${{ secrets.CAREERJET_AFFID }}
          JOOBLE_KEY: ${{ secrets.JOOBLE_KEY }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          BRAVE_KEY: ${{ secrets.BRAVE_KEY }}
          GOOGLE_ALERTS_FEEDS: ${{ secrets.GOOGLE_ALERTS_FEEDS }}
        run: python -m pipeline.run collect --shard ${{ matrix.shard }} --shards ${{ needs.plan.outputs.site_shards }} --role sites
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sites-${{ matrix.shard }}
          path: out/shard_*.json
          retention-days: 3
          if-no-files-found: ignore

  merge:
    needs: [plan, search, sites]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          pattern: "*-*"
          path: out
          merge-multiple: true
      - name: Combine, remove duplicates, add new jobs to the Sheet
        env:
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
          APPS_SCRIPT_SECRET: ${{ secrets.APPS_SCRIPT_SECRET }}
          LOOKBACK_DAYS: ${{ inputs.lookback_days }}
        run: python -m pipeline.run merge
      - name: Save job history
        if: always()
        run: |
          git config user.name "job-alerts-bot"
          git config user.email "job-alerts-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Job alerts $(date -u +%F)"
          for i in 1 2 3; do git pull --rebase origin main && git push && break; sleep 10; done
