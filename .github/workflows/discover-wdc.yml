name: One-time import (Web Data Commons job sites)

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: discovery
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - id: vis
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "private=$(gh api repos/${{ github.repository }} --jq .private || echo true)" >> $GITHUB_OUTPUT
      - name: Discover
        env:
          PRIVATE_REPO: ${{ steps.vis.outputs.private }}
        run: python -m pipeline.discover wdc
      - name: Save what was found
        if: always()
        run: |
          git config user.name "job-alerts-bot"
          git config user.email "job-alerts-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Discovery (wdc) $(date -u +%F)"
          for i in 1 2 3; do git pull --rebase origin main && git push && break; sleep 10; done
